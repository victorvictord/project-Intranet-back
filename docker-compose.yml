services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - app-network

  bff:
    build: ./bff
    ports:
      - "4000:4000"
    depends_on:
      - rabbitmq
      - messages-service
    networks:
      - app-network

  messages-service:
    build: ./microservices/messageService
    ports:
      - "4003:4003"
    depends_on:
      - rabbitmq
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
